# CivicAI Render Blueprint - backend API
# See DEPLOY_VERCEL_RENDER.md for setup steps.

services:
  - type: web
    name: civicai-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt && chmod +x start.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_NAME
        value: CivicAI
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/civic_ai.db
      - key: CORS_ORIGINS
        value: https://oosc-civicai-project.vercel.app
      - key: LLM_PROVIDER
        value: fallback
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
