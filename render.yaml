# CivicAI — Render Blueprint (backend + PostgreSQL)
#
# One-click deploy:
#   1. Push this repo to GitHub
#   2. https://dashboard.render.com/blueprints → New Blueprint Instance
#   3. Connect the repo and enter secret env vars when prompted
#   4. Deploy frontend on Vercel (see DEPLOY_VERCEL_RENDER.md)

databases:
  - name: civicai-db
    databaseName: civic_ai
    plan: free
    region: singapore

services:
  - type: web
    name: civicai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    pythonVersion: "3.12.8"
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: CivicAI
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
