# CivicAI Render Blueprint - backend + PostgreSQL
# See DEPLOY_VERCEL_RENDER.md for setup steps.

databases:
  - name: civicai-db
    databaseName: civic_ai
    plan: free
    region: singapore

services:
  - type: web
    name: civicai-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_NAME
        value: CivicAI
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
