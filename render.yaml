# CivicAI — Render Blueprint (backend + PostgreSQL)
#
# Deploy:
#   1. Push repo to GitHub (branch: main)
#   2. https://dashboard.render.com/blueprints → New Blueprint Instance
#   3. Select repo → review this file → fill secret env vars → Apply
#   4. Deploy frontend on Vercel (see DEPLOY_VERCEL_RENDER.md)

databases:
  - name: civicai-db
    databaseName: civic_ai
    plan: free
    region: singapore

services:
  - type: web
    name: civicai-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    pythonVersion: "3.12.8"
    buildCommand: ./build.sh
    preDeployCommand: ./predeploy.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: CivicAI
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
